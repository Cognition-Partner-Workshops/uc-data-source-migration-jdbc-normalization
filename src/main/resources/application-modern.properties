# =============================================================================
# MODERN SCHEMA PROFILE (H2 in-memory for local dev/testing)
# =============================================================================
# Activate with: ./mvnw spring-boot:run -Dspring.profiles.active=modern
# Uses the modern normalized schema with proper types in H2.
# =============================================================================

spring.application.name=loan-service

# H2 in-memory with modern schema
spring.datasource.url=jdbc:h2:mem:moderndb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Initialize both legacy + modern schemas, then run migration at startup
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema-legacy.sql,classpath:schema-modern.sql
spring.sql.init.data-locations=classpath:data-legacy.sql
