# =============================================================================
# SQL SERVER PROFILE CONFIGURATION
# =============================================================================
# Activate with: ./mvnw spring-boot:run -Dspring.profiles.active=sqlserver
# =============================================================================

spring.application.name=loan-service

# SQL Server Data Source
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=LoanServiceDB;encrypt=true;trustServerCertificate=true
spring.datasource.driverClassName=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.datasource.username=sa
spring.datasource.password=YourStrongPassword123!

# JPA / Hibernate for SQL Server
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Disable H2 console (not relevant for SQL Server)
spring.h2.console.enabled=false

# SQL initialization disabled (schema managed by migration scripts)
spring.sql.init.mode=never
