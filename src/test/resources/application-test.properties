spring.application.name=data-source-migration-test

# H2 in-memory for tests (PostgreSQL compatibility mode)
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;INIT=CREATE SCHEMA IF NOT EXISTS legacy_cdw\\;CREATE SCHEMA IF NOT EXISTS ods\\;CREATE SCHEMA IF NOT EXISTS staging\\;CREATE SCHEMA IF NOT EXISTS mv_loan\\;CREATE SCHEMA IF NOT EXISTS mv_customer\\;CREATE SCHEMA IF NOT EXISTS mv_collateral
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# JPA
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Disable Flyway for tests - JPA ddl-auto=create handles entity tables
spring.flyway.enabled=false

# Spring Batch
spring.batch.jdbc.initialize-schema=always
spring.batch.job.enabled=false

# Batch tuning
batch.chunk-size=10
batch.page-size=10
