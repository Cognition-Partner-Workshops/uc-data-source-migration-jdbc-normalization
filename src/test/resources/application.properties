spring.application.name=loan-service

# Test data source.
# The main config pins a single in-memory DB with DB_CLOSE_DELAY=-1, which keeps
# one DB alive for the whole JVM; with multiple @SpringBootTest contexts the
# schema-init script then runs twice against the same DB ("table already exists").
# Letting Spring Boot generate a unique embedded DB name per context isolates
# each test context while still loading the legacy schema and seed data.
spring.datasource.generate-unique-name=true
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false

spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema-legacy.sql
spring.sql.init.data-locations=classpath:data-legacy.sql
