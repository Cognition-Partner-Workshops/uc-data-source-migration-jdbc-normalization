<mat-card>
  <mat-card-header>
    <mat-card-title>Borrowers</mat-card-title>
    <mat-card-subtitle>Legacy data warehouse borrower records</mat-card-subtitle>
  </mat-card-header>
  <mat-card-content>
    @if (loading) {
      <div class="spinner-container">
        <mat-spinner diameter="48"></mat-spinner>
      </div>
    } @else {
      <div class="table-container">
        <table mat-table [dataSource]="borrowers" class="full-width">
          <ng-container matColumnDef="id">
            <th mat-header-cell *matHeaderCellDef>ID</th>
            <td mat-cell *matCellDef="let b">{{ b.id }}</td>
          </ng-container>

          <ng-container matColumnDef="fullName">
            <th mat-header-cell *matHeaderCellDef>Name</th>
            <td mat-cell *matCellDef="let b">{{ b.fullName }}</td>
          </ng-container>

          <ng-container matColumnDef="email">
            <th mat-header-cell *matHeaderCellDef>Email</th>
            <td mat-cell *matCellDef="let b">{{ b.email }}</td>
          </ng-container>

          <ng-container matColumnDef="phone">
            <th mat-header-cell *matHeaderCellDef>Phone</th>
            <td mat-cell *matCellDef="let b">{{ b.phone }}</td>
          </ng-container>

          <ng-container matColumnDef="city">
            <th mat-header-cell *matHeaderCellDef>City</th>
            <td mat-cell *matCellDef="let b">{{ b.city }}</td>
          </ng-container>

          <ng-container matColumnDef="state">
            <th mat-header-cell *matHeaderCellDef>State</th>
            <td mat-cell *matCellDef="let b">{{ b.state }}</td>
          </ng-container>

          <ng-container matColumnDef="creditScore">
            <th mat-header-cell *matHeaderCellDef>Credit Score</th>
            <td mat-cell *matCellDef="let b">{{ b.creditScore }}</td>
          </ng-container>

          <ng-container matColumnDef="employmentStatus">
            <th mat-header-cell *matHeaderCellDef>Employment</th>
            <td mat-cell *matCellDef="let b">{{ b.employmentStatus }}</td>
          </ng-container>

          <ng-container matColumnDef="actions">
            <th mat-header-cell *matHeaderCellDef></th>
            <td mat-cell *matCellDef="let b">
              <a mat-icon-button [routerLink]="['/borrowers', b.id]" color="primary">
                <mat-icon>visibility</mat-icon>
              </a>
            </td>
          </ng-container>

          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
        </table>
      </div>
    }
  </mat-card-content>
</mat-card>
